<body>

<div class="bg"></div>

<div class="container">
  <header>

  <div class="lang-row">

  <div class="upload-tip" id="uploadTip"></div>

  <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()"
       ondragover="handleDragOver(event)" ondrop="handleDrop(event)" ondragleave="handleDragLeave(event)">

    <div class="loading-ring"></div>

  <div class="result-card" id="resultCard">

      <div class="result-icon">🎿</div>
      <div>
        <div class="result-title" id="resultTitle">Your ski analysis</div>

    <div class="result-body" id="resultBody"></div>
  </div>

  <button class="new-btn" id="newBtn" onclick="resetApp()">↩ New analysis</button>

</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let currentLang = 'en';
let extractedFrames = [];
let frameLabels = [];
let currentFile = null;
let videoEl = null;
let videoUrl = null;
let cropGeneration = 0;
let lastAnalysisSkill = '';
let ttsSpeakingBtn = null;

const UI_TEXT = {
  da: {
    uploadTip: 'Tip: Film skiløberen fra fronten og mens de passerer forbi dig for bedst resultat.',
    uploadTitle: 'Upload video eller billede',

  },
  en: {

    uploadSub: 'Scrub the video to where you want to start the analysis. The analysis covers 1–2 turns from that point.',
    videoLabel: 'Move the marker to where you want to start the analysis',
    markBtn: '▶ Start analysis from here',
    analyzeBtn: 'Analyse my skiing',
    loadingTitle: 'Analysing your skiing...',
    loadingSub: 'AI ski instructor is working',
    steps: ['Sending frames for analysis', 'Analysing technique and balance', 'Identifying root cause and skill focus', 'Compiling feedback'],
    resultTitle: 'Your ski analysis',
    resultSubtitle: 'PSIA analysis',
    newBtn: '↩ New analysis',
    labelStrengths: '✓ What I see',
    labelFocus: '→ Skill focus',
    labelExercise: '⬤ Try this exercise',
    labelQuote: '💬 Feel this',
    techBtn: '📖 Dive into the technical explanation',
    techLoading: 'Loading...',
  },
  zh: {
    uploadTip: '提示：从正面拍摄滑雪者，并在他们经过您身旁时拍摄，效果最佳。',
    uploadTitle: '上传视频或图片',
    uploadSub: '拖动视频进度条到您想开始分析的位置，分析涵盖从该点起的1-2个转弯。',
    videoLabel: '将标记移动到您想要开始分析的位置',
    markBtn: '▶ 从此处开始分析',
    analyzeBtn: '分析我的滑雪',
    loadingTitle: '正在分析您的滑雪...',
    loadingSub: 'AI滑雪教练正在分析',
    steps: ['发送帧进行分析', '分析技术与平衡', '识别技术重点', '整合反馈意见'],
    resultTitle: '您的滑雪分析',
    resultSubtitle: 'PSIA 分析',
    newBtn: '↩ 新的分析',
    labelStrengths: '✓ 我看到的',
    labelFocus: '→ 技术重点',
    labelExercise: '⬤ 尝试这个练习',
    labelQuote: '💬 感受这个',
    techBtn: '📖 深入了解技术说明',
    techLoading: '加载中...',
  }
};

// ─── LANGUAGE ─────────────────────────────────────────────────────────────────
function setLang(lang, btn) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const t = UI_TEXT[lang];
  document.getElementById('uploadTip').textContent = t.uploadTip;
  document.getElementById('uploadTitle').textContent = t.uploadTitle;
  document.getElementById('uploadSub').textContent = t.uploadSub;
  document.getElementById('analyzeBtnText').textContent = t.analyzeBtn;
  document.getElementById('videoPreviewLabel').textContent = t.videoLabel;
  document.getElementById('markBtn').textContent = t.markBtn;
}

(function() {
  document.getElementById('uploadTip').textContent = UI_TEXT[currentLang].uploadTip;
})();

// ─── DRAG & DROP ──────────────────────────────────────────────────────────────
function handleDragOver(e) { e.preventDefault(); document.getElementById('uploadZone').classList.add('dragover'); }
function handleDragLeave(e) { document.getElementById('uploadZone').classList.remove('dragover'); }
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('uploadZone').classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
}
function handleFile(e) {
  const file = e.target.files[0];
  if (file) processFile(file);
}

// ─── FILE PROCESSING ──────────────────────────────────────────────────────────
function processFile(file) {
  currentFile = file;
  const isVideo = file.type.startsWith('video/');
  const isImage = file.type.startsWith('image/');
  if (!isVideo && !isImage) return showError('Please upload a video or image file.');
  document.getElementById('uploadZone').style.display = 'none';
  document.getElementById('uploadTip').style.display = 'none';
  if (isImage) extractFramesFromImage(file);
  else extractFramesFromVideo(file);
}

function resizeImageToBase64(dataUrl, maxWidth, maxHeight, callback) {
  const img = new Image();
  img.onload = () => {
    let w = img.width, h = img.height;
    if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
    if (h > maxHeight) { w = w * maxHeight / h; h = maxHeight; }
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(w);
    canvas.height = Math.round(h);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    callback(canvas.toDataURL('image/jpeg', 0.75));
  };
  img.src = dataUrl;
}

function extractFramesFromImage(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    resizeImageToBase64(e.target.result, 1024, 1024, (resized) => {
      extractedFrames = [resized];
      frameLabels = ['Image'];
      runAnalysis();
    });
  };
  reader.readAsDataURL(file);
}

function extractFramesFromVideo(file) {
  const preview = document.getElementById('videoPreview');
  const url = URL.createObjectURL(file);
  videoUrl = url;

  const timeout = setTimeout(() => {
    URL.revokeObjectURL(url);
    videoUrl = null;
    showError('Video could not be read. Try uploading an image instead.');
  }, 10000);

  preview.onloadeddata = () => {
    clearTimeout(timeout);
    videoEl = preview;
    document.getElementById('videoPreviewSection').classList.add('visible');
  };

  preview.onerror = () => {
    clearTimeout(timeout);
    URL.revokeObjectURL(url);
    videoUrl = null;
    showError('Video could not be read. Try uploading an image instead.');
  };

  preview.src = url;
  preview.load();
}

function markTurnStart() {
  if (!videoEl) return;

  const startTime = videoEl.currentTime;
  const duration = videoEl.duration || Infinity;

  document.getElementById('videoPreviewSection').classList.remove('visible');
  extractedFrames = [];
  frameLabels = [];
  document.getElementById('analyzeBtn').classList.remove('visible');

  const offsets = [0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0];
  const validOffsets = offsets.filter(o => (startTime + o) <= duration);
  const timestamps = validOffsets.map(o => startTime + o);
  const labels = validOffsets.map(o => `+${o.toFixed(2)}s`);

  const gen = ++cropGeneration;
  captureFrames(videoEl, timestamps, videoUrl, labels, gen);
}

function captureFrames(video, timestamps, url, labels, gen) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const frames = [];
  let idx = 0;

  function captureCurrentFrame() {
    try {
      canvas.width = Math.min(video.videoWidth || 640, 1024);
      canvas.height = Math.min(video.videoHeight || 360, 1024);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      frames.push(canvas.toDataURL('image/jpeg', 0.75));
    } catch(e) { /* skip */ }
  }

  function finish() {
    video.onseeked = null;
    URL.revokeObjectURL(url);
    videoUrl = null;
    videoEl = null;
    if (frames.length === 0) {
      showError('Could not extract frames. Try uploading an image instead.');
      resetApp();
      return;
    }
    applyMotionCrop(frames).then(cropped => {
      if (gen !== cropGeneration) return;
      extractedFrames = cropped;
      frameLabels = (labels || []).slice(0, cropped.length);
      runAnalysis();
    });
  }

  function seekNext() {
    if (idx >= timestamps.length) { finish(); return; }
    const target = timestamps[idx];
    // If already at target time, onseeked won't fire — capture directly
    if (Math.abs((video.currentTime || 0) - target) < 0.02) {
      captureCurrentFrame();
      idx++;
      seekNext();
    } else {
      try { video.currentTime = target; }
      catch(e) { captureCurrentFrame(); idx++; seekNext(); }
    }
  }

  video.onseeked = () => {
    captureCurrentFrame();
    idx++;
    seekNext();
  };

  seekNext();
}

// ─── CENTER CROP ──────────────────────────────────────────────────────────────
async function applyMotionCrop(frames) {
  return Promise.all(frames.map(frame => cropToCentroid(frame, 0.5, 0.5)));
}

function cropToCentroid(dataUrl, cx, cy) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const W = img.width, H = img.height;
      const CROP = 0.70;
      const cw = Math.round(W * CROP), ch = Math.round(H * CROP);
      let x = Math.max(0, Math.min(W - cw, Math.round(cx * W - cw / 2)));
      let y = Math.max(0, Math.min(H - ch, Math.round(cy * H - ch / 2)));
      const out = document.createElement('canvas');
      out.width = W; out.height = H;
      out.getContext('2d').drawImage(img, x, y, cw, ch, 0, 0, W, H);
      resolve(out.toDataURL('image/jpeg', 0.80));
    };
    img.src = dataUrl;
  });
}

// ─── ANALYSIS ─────────────────────────────────────────────────────────────────
async function runAnalysis() {
  const t = UI_TEXT[currentLang];
  document.getElementById('analyzeBtn').style.display = 'none';
  document.getElementById('resultCard').classList.remove('visible');
  document.getElementById('errorBox').classList.remove('visible');
  document.getElementById('newBtn').classList.remove('visible');

  const loadingState = document.getElementById('loadingState');
  loadingState.classList.add('visible');
  document.getElementById('loadingTitle').textContent = t.loadingTitle;
  document.getElementById('loadingSub').textContent = t.loadingSub;

  const stepsEl = document.getElementById('loadingSteps');
  stepsEl.innerHTML = t.steps.map((s, i) =>
    `<div class="loading-step" id="step${i}"><div class="step-dot"></div><span>${s}</span></div>`
  ).join('');

  activateStep(0);

  try {
    const frameBase64s = extractedFrames.map(f => {
      const parts = f.split(',');
      return parts.length > 1 ? parts[1] : parts[0];
    });

    activateStep(1);

    const response = await fetch('/.netlify/functions/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ images: frameBase64s, frameLabels, language: currentLang })
    });

    activateStep(2);

    let respData;
    try { respData = await response.json(); }
    catch(e) { throw new Error('JSON parse error: ' + e.message); }

    if (!response.ok) {
      throw new Error(`API ${response.status}: ${respData?.error?.message || respData?.error || 'Unknown API error'}`);
    }

    activateStep(3);

    const text = (respData.text || '').trim();
    if (!text) throw new Error('Empty response. Debug: ' + JSON.stringify(respData).substring(0, 200));

    setTimeout(() => {
      loadingState.classList.remove('visible');
      showResult(respData);
    }, 600);

  } catch (err) {
    loadingState.classList.remove('visible');
    showError(err.message || 'Unknown error');
    document.getElementById('uploadZone').style.display = '';
    document.getElementById('uploadTip').style.display = '';
    document.getElementById('analyzeBtn').style.display = extractedFrames.length ? 'flex' : 'none';
  }
}

function activateStep(idx) {
  document.querySelectorAll('.loading-step').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i < idx) el.classList.add('done');
    else if (i === idx) el.classList.add('active');
  });
}

// ─── RESULT DISPLAY ───────────────────────────────────────────────────────────
function showResult(data) {
  const text = data.text || '';
  const t = UI_TEXT[currentLang];
  document.getElementById('resultTitle').textContent = t.resultTitle;

  const body = document.getElementById('resultBody');
  body.innerHTML = '';
  lastAnalysisSkill = '';

  // Canvas for best frame (drawn async — silhouette reads lastAnalysisSkill via closure)
  let frameCanvas = null;
  if (data.bestFrameImage) {
    const wrap = document.createElement('div');
    wrap.className = 'result-frame-wrap';
    frameCanvas = document.createElement('canvas');
    frameCanvas.className = 'result-frame-canvas';
    wrap.appendChild(frameCanvas);
    body.appendChild(wrap);
  }

  // Parse text sections
  const sections = [
    { keys: ['✓ WHAT I SEE:', '✓ HVAD JEG SER:', '✓ 我看到的:'], label: t.labelStrengths, dotClass: 'green', labelClass: 'label-green', isQuote: false },
    { keys: ['→ SKILL FOCUS:', '→ SKILL FOKUS:', '→ 技术重点:'], label: t.labelFocus, dotClass: 'orange', labelClass: 'label-orange', isQuote: false },
    { keys: ['⬤ TRY THIS:', '⬤ PRØV DETTE:', '⬤ 尝试这个:'], label: t.labelExercise, dotClass: 'blue', labelClass: 'label-blue', isQuote: false },
    { keys: ['💬 FEEL THIS:', '💬 MÆRK DETTE:', '💬 感受这个:'], label: t.labelQuote, dotClass: 'gold', labelClass: 'label-gold', isQuote: true },
  ];

  function findKey(keys) {
    for (const k of keys) {
      const idx = text.indexOf(k);
      if (idx !== -1) return { key: k, idx };
    }
    return null;
  }

  const found = sections.map(s => {
    const match = findKey(s.keys);
    return match ? { ...s, matchKey: match.key, startIdx: match.idx } : null;
  }).filter(Boolean).sort((a, b) => a.startIdx - b.startIdx);

  found.forEach((section, i) => {
    const contentStart = section.startIdx + section.matchKey.length;
    const contentEnd = found[i + 1] ? found[i + 1].startIdx : text.length;
    const content = text.substring(contentStart, contentEnd).trim();
    if (!content) return;

    // Extract skill name for silhouette + tech button
    if (!lastAnalysisSkill && (section.keys[0] === '→ SKILL FOCUS:')) {
      const skillNames = ['Rotational Control', 'Edge Control', 'Pressure Control', 'Balance', '旋转控制', '刃角控制', '压力控制', '平衡'];
      for (const sn of skillNames) {
        if (content.toLowerCase().includes(sn.toLowerCase())) { lastAnalysisSkill = sn; break; }
      }
      if (!lastAnalysisSkill) lastAnalysisSkill = content.split('\n')[0].trim().substring(0, 60);
    }

    const div = document.createElement('div');
    div.className = 'result-section';
    const contentHtml = section.isQuote
      ? `<div class="quote-box">${content}</div>`
      : `<div class="result-text">${content}</div>`;
    div.innerHTML = `
      <div class="result-section-label ${section.labelClass}">
        <div class="label-dot ${section.dotClass}"></div>
        <span>${section.label}</span>
        <button class="speak-btn" title="Listen">🔊</button>
      </div>
      ${contentHtml}`;
    const speakBtn = div.querySelector('.speak-btn');
    speakBtn.addEventListener('click', (e) => { e.stopPropagation(); speakSection(content, speakBtn); });
    body.appendChild(div);
  });

  if (found.length === 0) {
    const fallback = document.createElement('div');
    fallback.className = 'result-text';
    fallback.innerHTML = text.replace(/\n/g, '<br>');
    body.appendChild(fallback);
  }

  // Now draw frame + silhouette (lastAnalysisSkill is set by section parsing above)
  if (frameCanvas && data.bestFrameImage) {
    drawBestFrame(frameCanvas, data.bestFrameImage);
  }

  // Tech explanation button
  const techBtn = document.createElement('button');
  techBtn.className = 'tech-btn';
  techBtn.id = 'techBtn';
  techBtn.textContent = t.techBtn;
  techBtn.style.display = lastAnalysisSkill ? 'block' : 'none';
  techBtn.onclick = runTechnicalExplanation;
  body.appendChild(techBtn);

  document.getElementById('resultCard').classList.add('visible');
  document.getElementById('newBtn').textContent = t.newBtn;
  document.getElementById('newBtn').classList.add('visible');
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ─── FRAME + SILHOUETTE ───────────────────────────────────────────────────────
function drawBestFrame(canvas, b64) {
  const img = new Image();
  img.onload = () => {
    const MAX_W = 440, MAX_H = 300;
    const scale = Math.min(MAX_W / img.width, MAX_H / img.height, 1);
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  };
  img.src = 'data:image/jpeg;base64,' + b64;
}

// ─── TEXT TO SPEECH ───────────────────────────────────────────────────────────
function speakSection(text, btn) {
  if (!('speechSynthesis' in window)) return;

  // Toggle off if already speaking this section
  if (ttsSpeakingBtn === btn && speechSynthesis.speaking) {
    speechSynthesis.cancel();
    return;
  }

  speechSynthesis.cancel();

  const doSpeak = () => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = currentLang === 'zh' ? 'zh-CN' : 'en-GB';
    utterance.rate = 0.88;
    utterance.pitch = 1.05;

    const voices = speechSynthesis.getVoices();
    let voice = null;
    if (currentLang === 'zh') {
      voice = voices.find(v => v.lang.startsWith('zh')) || null;
    } else {
      // Prefer warm, clear voices: Google UK Female, then macOS/iOS named voices
      // Prefer warm, empathetic male voices
      const preferred = ['Google UK English Male', 'Daniel', 'Rishi', 'Oliver', 'Arthur', 'Alex', 'Google US English'];
      for (const name of preferred) {
        const found = voices.find(v => v.name === name);
        if (found) { voice = found; break; }
      }
      if (!voice) voice = voices.find(v => v.lang === 'en-GB' && v.name.toLowerCase().includes('male'))
                        || voices.find(v => v.lang === 'en-GB')
                        || voices.find(v => v.lang.startsWith('en')) || null;
    }
    if (voice) utterance.voice = voice;

    utterance.onstart = () => { btn.textContent = '⏹'; btn.classList.add('speaking'); ttsSpeakingBtn = btn; };
    utterance.onend = () => { btn.textContent = '🔊'; btn.classList.remove('speaking'); if (ttsSpeakingBtn === btn) ttsSpeakingBtn = null; };
    utterance.onerror = () => { btn.textContent = '🔊'; btn.classList.remove('speaking'); if (ttsSpeakingBtn === btn) ttsSpeakingBtn = null; };

    speechSynthesis.speak(utterance);
  };

  // Voices load asynchronously on first access in some browsers
  if (speechSynthesis.getVoices().length === 0) {
    speechSynthesis.addEventListener('voiceschanged', doSpeak, { once: true });
  } else {
    doSpeak();
  }
}

// ─── TECHNICAL EXPLANATION ────────────────────────────────────────────────────
async function runTechnicalExplanation() {
  const t = UI_TEXT[currentLang];
  const techBtn = document.getElementById('techBtn');
  if (!techBtn) return;

  techBtn.disabled = true;
  techBtn.textContent = t.techLoading;

  const existing = document.getElementById('techExplanation');
  if (existing) existing.remove();

  try {
    const response = await fetch('/.netlify/functions/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'technical', skill: lastAnalysisSkill, language: currentLang })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'API error');

    const explanation = data.explanation || '';
    const div = document.createElement('div');
    div.id = 'techExplanation';
    div.className = 'tech-explanation';

    const techHeader = document.createElement('div');
    techHeader.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;';
    const techSpeakBtn = document.createElement('button');
    techSpeakBtn.className = 'speak-btn';
    techSpeakBtn.title = 'Listen';
    techSpeakBtn.textContent = '🔊';
    techSpeakBtn.style.opacity = '0.5';
    techSpeakBtn.addEventListener('click', () => speakSection(explanation, techSpeakBtn));
    techHeader.appendChild(techSpeakBtn);

    const techText = document.createElement('p');
    techText.style.cssText = 'margin:0;line-height:1.7;';
    techText.textContent = explanation;

    div.appendChild(techHeader);
    div.appendChild(techText);
    techBtn.parentNode.insertBefore(div, techBtn.nextSibling);
    techBtn.style.display = 'none';

  } catch(err) {
    techBtn.disabled = false;
    techBtn.textContent = t.techBtn;
    showError(err.message);
  }
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = msg;
  el.classList.add('visible');
}

function resetApp() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  ttsSpeakingBtn = null;
  cropGeneration++;
  extractedFrames = [];
  frameLabels = [];
  currentFile = null;
  lastAnalysisSkill = '';
  if (videoUrl) { URL.revokeObjectURL(videoUrl); videoUrl = null; }
  videoEl = null;
  const preview = document.getElementById('videoPreview');
  preview.onloadeddata = null;
  preview.onerror = null;
  preview.onseeked = null;
  preview.pause();
  preview.removeAttribute('src');
  preview.load();
  document.getElementById('uploadZone').style.display = '';
  document.getElementById('uploadTip').style.display = '';
  document.getElementById('videoPreviewSection').classList.remove('visible');
  document.getElementById('analyzeBtn').classList.remove('visible');
  document.getElementById('analyzeBtn').style.display = '';
  document.getElementById('resultCard').classList.remove('visible');
  document.getElementById('newBtn').classList.remove('visible');
  document.getElementById('errorBox').classList.remove('visible');
  document.getElementById('loadingState').classList.remove('visible');
  document.getElementById('fileInput').value = '';
}
