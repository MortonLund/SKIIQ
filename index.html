<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiIQ — Film dine sving. Få feedback på 30 sekunder.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --ice: #E8F4F8;
    --snow: #F7FAFB;
    --alpine: #0D2B3E;
    --glacier: #1A5276;
    --frost: #5DADE2;
    --accent: #E8551A;
    --gold: #F4C842;
    --text: #0D2B3E;
    --muted: #6B8A9A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--alpine);
    color: var(--snow);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BACKGROUND */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(160deg, #0D2B3E 0%, #0a1f2e 40%, #061318 100%);
  }
  .bg::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(93,173,226,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(26,82,118,0.12) 0%, transparent 50%);
  }

  /* LAYOUT */
  .container {
    position: relative; z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* HEADER */
  header {
    padding: 40px 0 32px;
    text-align: center;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--snow);
  }
  .logo span { color: var(--frost); }
  .tagline {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.5px;
    font-weight: 300;
  }

  /* LANGUAGE SELECTOR */
  .lang-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 32px;
  }
  .lang-btn {
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid rgba(93,173,226,0.2);
    background: rgba(93,173,226,0.05);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .lang-btn.active {
    background: var(--frost);
    border-color: var(--frost);
    color: var(--alpine);
    font-weight: 600;
  }

  /* UPLOAD ZONE */
  .upload-zone {
    border: 1.5px dashed rgba(93,173,226,0.3);
    border-radius: 20px;
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: rgba(93,173,226,0.03);
    position: relative;
    overflow: hidden;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--frost);
    background: rgba(93,173,226,0.07);
  }
  .upload-zone input { display: none; }

  .upload-icon {
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    background: rgba(93,173,226,0.1);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .upload-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--snow);
  }
  .upload-sub {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* FRAMES PREVIEW */
  .frames-section {
    margin-top: 24px;
    display: none;
  }
  .frames-section.visible { display: block; }

  .section-label {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .frames-grid {
    display: grid;
    gap: 6px;
  }

  .frame-item {
    position: relative;
    aspect-ratio: 9/16;
    border-radius: 10px;
    overflow: hidden;
    background: rgba(93,173,226,0.05);
    border: 1px solid rgba(93,173,226,0.1);
  }
  .frame-item img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .frame-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(13,43,62,0.9));
    padding: 4px 4px 5px;
    font-size: 7px;
    font-weight: 600;
    text-align: center;
    color: var(--frost);
    letter-spacing: 0.3px;
    line-height: 1.2;
  }
  .frame-loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .spinner-small {
    width: 16px; height: 16px;
    border: 2px solid rgba(93,173,226,0.2);
    border-top-color: var(--frost);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* ANALYZE BUTTON */
  .analyze-btn {
    width: 100%;
    margin-top: 20px;
    padding: 18px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, var(--frost) 0%, #2E86C1 100%);
    color: var(--alpine);
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: all 0.2s;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .analyze-btn.visible { display: flex; }
  .analyze-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(93,173,226,0.3); }
  .analyze-btn:disabled {
    opacity: 0.6; cursor: not-allowed; transform: none;
  }

  /* LOADING STATE */
  .loading-state {
    margin-top: 32px;
    text-align: center;
    display: none;
  }
  .loading-state.visible { display: block; }

  .loading-ring {
    width: 56px; height: 56px;
    border: 3px solid rgba(93,173,226,0.15);
    border-top-color: var(--frost);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--snow);
    margin-bottom: 6px;
  }
  .loading-sub { font-size: 12px; color: var(--muted); }

  .loading-steps {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .loading-step {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(93,173,226,0.05);
    border: 1px solid rgba(93,173,226,0.1);
    font-size: 12px;
    color: var(--muted);
    transition: all 0.3s;
  }
  .loading-step.active {
    color: var(--snow);
    background: rgba(93,173,226,0.1);
    border-color: rgba(93,173,226,0.25);
  }
  .loading-step.done {
    color: var(--frost);
    border-color: rgba(93,173,226,0.2);
  }
  .step-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(93,173,226,0.2);
    flex-shrink: 0;
    transition: all 0.3s;
  }
  .loading-step.active .step-dot { background: var(--frost); box-shadow: 0 0 8px var(--frost); }
  .loading-step.done .step-dot { background: var(--frost); }

  /* RESULT CARD */
  .result-card {
    margin-top: 24px;
    border-radius: 20px;
    overflow: hidden;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(93,173,226,0.15);
    display: none;
    animation: fadeUp 0.5s ease forwards;
  }
  .result-card.visible { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid rgba(93,173,226,0.1);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .result-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: rgba(93,173,226,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .result-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--snow);
  }
  .result-subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .result-body { padding: 20px; }

  .result-section {
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(93,173,226,0.08);
  }
  .result-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

  .result-section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .label-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .label-dot.green { background: #58D68D; }
  .label-dot.orange { background: var(--accent); }
  .label-dot.blue { background: var(--frost); }
  .label-dot.gold { background: var(--gold); }

  .label-green { color: #58D68D; }
  .label-orange { color: var(--accent); }
  .label-blue { color: var(--frost); }
  .label-gold { color: var(--gold); }

  .result-text {
    font-size: 14px;
    line-height: 1.65;
    color: rgba(247,250,251,0.85);
    white-space: pre-wrap;
  }

  .quote-box {
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(244,200,66,0.08);
    border-left: 3px solid var(--gold);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--gold);
    font-style: italic;
    line-height: 1.4;
  }

  /* NEW ANALYSIS BUTTON */
  .new-btn {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(93,173,226,0.2);
    background: transparent;
    color: var(--frost);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: none;
  }
  .new-btn.visible { display: block; }
  .new-btn:hover { background: rgba(93,173,226,0.08); }

  /* ERROR */
  .error-box {
    margin-top: 20px;
    padding: 16px;
    border-radius: 12px;
    background: rgba(232,85,26,0.1);
    border: 1px solid rgba(232,85,26,0.2);
    font-size: 13px;
    color: #F1948A;
    display: none;
  }
  .error-box.visible { display: block; }
</style>
</head>
<body>

<div class="bg"></div>

<div class="container">
  <header>
    <div class="logo">Ski<span>IQ</span></div>
    <div class="tagline">Film dine sving — få feedback på 30 sekunder</div>
  </header>

  <!-- Language -->
  <div class="lang-row">
    <button class="lang-btn active" onclick="setLang('da', this)">🇩🇰 Dansk</button>
    <button class="lang-btn" onclick="setLang('en', this)">🇬🇧 English</button>
    <button class="lang-btn" onclick="setLang('zh', this)">🇨🇳 中文</button>
  </div>

  <!-- Upload -->
  <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()"
       ondragover="handleDragOver(event)" ondrop="handleDrop(event)" ondragleave="handleDragLeave(event)">
    <input type="file" id="fileInput" accept="video/*,image/*" onchange="handleFile(event)">
    <div class="upload-icon">🎿</div>
    <div class="upload-title" id="uploadTitle">Upload video eller billede</div>
    <div class="upload-sub" id="uploadSub">Optag et sving på pisten og upload det her.<br>Video eller billede accepteres.</div>
  </div>

  <!-- Frames -->
  <div class="frames-section" id="framesSection">
    <div class="section-label" id="framesLabel">3 frames udtrukket</div>
    <div class="frames-grid" id="framesGrid"></div>
  </div>

  <!-- Analyze button -->
  <button class="analyze-btn" id="analyzeBtn" onclick="runAnalysis()">
    <span>🔍</span> <span id="analyzeBtnText">Analysér mit skiløb</span>
  </button>

  <!-- Loading -->
  <div class="loading-state" id="loadingState">
    <div class="loading-ring"></div>
    <div class="loading-text" id="loadingTitle">Analyserer dit skiløb...</div>
    <div class="loading-sub" id="loadingSub">AI skiinstruktør er i gang</div>
    <div class="loading-steps" id="loadingSteps"></div>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox"></div>

  <!-- Result -->
  <div class="result-card" id="resultCard">
    <div class="result-header">
      <div class="result-icon">🎿</div>
      <div>
        <div class="result-title" id="resultTitle">Din skianalyse</div>
        <div class="result-subtitle" id="resultSubtitle">Baseret på 5 frames · Den Danske Skiskole</div>
      </div>
    </div>
    <div class="result-body" id="resultBody"></div>
  </div>

  <!-- New analysis -->
  <button class="new-btn" id="newBtn" onclick="resetApp()">↩ Ny analyse</button>

</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let currentLang = 'da';
let extractedFrames = [];
let currentFile = null;

const FRAME_LABELS = {
  da: ['Mod siden', 'Mod kameraet', 'Til den anden side'],
  en: ['Approaching', 'Facing camera', 'Departing'],
  zh: ['转向一侧', '面向镜头', '转向另一侧']
};

const UI_TEXT = {
  da: {
    uploadTitle: 'Upload video eller billede',
    uploadSub: 'Optag ét sving på pisten og upload det her.\nVideo eller billede accepteres.',
    framesLabel: '3 frames fra svingfaser udtrukket',
    analyzeBtn: 'Analysér mit skiløb',
    loadingTitle: 'Analyserer dit skiløb...',
    loadingSub: 'AI skiinstruktør er i gang',
    steps: ['Udtrækker 3 frames fra svinget', 'Analyserer teknik og balance', 'Identificerer rodårsag og fejlkæde', 'Sammenstiller feedback'],
    resultTitle: 'Din skianalyse',
    resultSubtitle: 'Baseret på 3 frames · Den Danske Skiskole',
    newBtn: '↩ Ny analyse',
    labelStrengths: '✓ Det der fungerer',
    labelFocus: '→ Dit udviklingsfokus',
    labelExercise: '⬤ Øvelse til nu',
    labelChain: '↑ Udviklingskæde',
    labelQuote: '💬 Husk dette',
  },
  en: {
    uploadTitle: 'Upload video or image',
    uploadSub: 'Film one turn on the slope and upload it here.\nVideo or image accepted.',
    framesLabel: '3 turn frames extracted',
    analyzeBtn: 'Analyse my skiing',
    loadingTitle: 'Analysing your skiing...',
    loadingSub: 'AI ski instructor is working',
    steps: ['Extracting 3 frames from the turn', 'Analysing technique and balance', 'Identifying root cause and error chain', 'Compiling feedback'],
    resultTitle: 'Your ski analysis',
    resultSubtitle: 'Based on 3 frames · Danish Ski School',
    newBtn: '↩ New analysis',
    labelStrengths: '✓ What is working',
    labelFocus: '→ Your development focus',
    labelExercise: '⬤ Exercise to try now',
    labelChain: '↑ Development chain',
    labelQuote: '💬 Remember this',
  },
  zh: {
    uploadTitle: '上传视频或图片',
    uploadSub: '在坡道上录制一个转弯并上传。\n接受视频或图片格式。',
    framesLabel: '已提取3帧转弯画面',
    analyzeBtn: '分析我的滑雪',
    loadingTitle: '正在分析您的滑雪...',
    loadingSub: 'AI滑雪教练正在分析',
    steps: ['从转弯中提取3帧', '分析技术与平衡', '识别根本原因与错误链', '整合反馈意见'],
    resultTitle: '您的滑雪分析',
    resultSubtitle: '基于3帧画面 · 丹麦滑雪学校',
    newBtn: '↩ 新的分析',
    labelStrengths: '✓ 做得好的地方',
    labelFocus: '→ 改进重点',
    labelExercise: '⬤ 立即尝试的练习',
    labelChain: '↑ 发展链',
    labelQuote: '💬 记住这一点',
  }
};

// ─── LANGUAGE ─────────────────────────────────────────────────────────────────
function setLang(lang, btn) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const t = UI_TEXT[lang];
  document.getElementById('uploadTitle').textContent = t.uploadTitle;
  document.getElementById('uploadSub').textContent = t.uploadSub;
  document.getElementById('analyzeBtnText').textContent = t.analyzeBtn;
}

// ─── DRAG & DROP ──────────────────────────────────────────────────────────────
function handleDragOver(e) { e.preventDefault(); document.getElementById('uploadZone').classList.add('dragover'); }
function handleDragLeave(e) { document.getElementById('uploadZone').classList.remove('dragover'); }
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('uploadZone').classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
}
function handleFile(e) {
  const file = e.target.files[0];
  if (file) processFile(file);
}

// ─── FILE PROCESSING ──────────────────────────────────────────────────────────
function processFile(file) {
  currentFile = file;
  const isVideo = file.type.startsWith('video/');
  const isImage = file.type.startsWith('image/');
  if (!isVideo && !isImage) return showError('Please upload a video or image file.');

  if (isImage) {
    extractFramesFromImage(file);
  } else {
    extractFramesFromVideo(file);
  }
}

function resizeImageToBase64(dataUrl, maxWidth, maxHeight, callback) {
  const img = new Image();
  img.onload = () => {
    let w = img.width, h = img.height;
    if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
    if (h > maxHeight) { w = w * maxHeight / h; h = maxHeight; }
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(w);
    canvas.height = Math.round(h);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    callback(canvas.toDataURL('image/jpeg', 0.75));
  };
  img.src = dataUrl;
}

function extractFramesFromImage(file) {
  showFramesLoading(1);
  const reader = new FileReader();
  reader.onload = (e) => {
    resizeImageToBase64(e.target.result, 1024, 1024, (resized) => {
      extractedFrames = [resized];
      showFrames(extractedFrames);
    });
  };
  reader.readAsDataURL(file);
}

function extractFramesFromVideo(file) {
  showFramesLoading(3);
  const video = document.createElement('video');
  video.preload = 'auto';
  video.muted = true;
  video.playsInline = true;
  video.setAttribute('playsinline', '');

  const url = URL.createObjectURL(file);
  video.src = url;

  // Timeout fallback
  const timeout = setTimeout(() => {
    URL.revokeObjectURL(url);
    showError('Video kunne ikke læses. Prøv at uploade et billede i stedet.');
    resetApp();
  }, 10000);

  video.onloadeddata = () => {
    clearTimeout(timeout);
    const duration = video.duration || 5;
    // 4 frames targeting the key phases of one ski turn
    // 3 frames: approaching one side, facing camera (fall line), departing other side
    const timestamps = [0.20, 0.50, 0.78].map(p => p * duration);
    captureFrames(video, timestamps, url);
  };

  video.onerror = () => {
    clearTimeout(timeout);
    URL.revokeObjectURL(url);
    showError('Video kunne ikke læses. Prøv at uploade et billede i stedet.');
    resetApp();
  };

  video.load();
}

function captureFrames(video, timestamps, url) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const frames = [];
  let idx = 0;

  function captureNext() {
    if (idx >= timestamps.length) {
      URL.revokeObjectURL(url);
      if (frames.length === 0) {
        showError('Kunne ikke udtrække frames. Prøv et billede i stedet.');
        resetApp();
        return;
      }
      extractedFrames = frames;
      showFrames(frames);
      return;
    }
    try {
      video.currentTime = timestamps[idx];
    } catch(e) {
      idx++;
      captureNext();
    }
  }

  video.onseeked = () => {
    try {
      canvas.width = Math.min(video.videoWidth || 640, 1024);
      canvas.height = Math.min(video.videoHeight || 360, 1024);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      frames.push(canvas.toDataURL('image/jpeg', 0.75));
    } catch(e) {
      // skip this frame
    }
    idx++;
    captureNext();
  };

  captureNext();
}

function showFramesLoading(count) {
  const grid = document.getElementById('framesGrid');
  grid.innerHTML = '';
  grid.style.gridTemplateColumns = `repeat(${count}, 1fr)`;
  for (let i = 0; i < count; i++) {
    const item = document.createElement('div');
    item.className = 'frame-item';
    item.innerHTML = '<div class="frame-loading"><div class="spinner-small"></div></div>';
    grid.appendChild(item);
  }
  document.getElementById('framesSection').classList.add('visible');
}

function showFrames(frames) {
  const t = UI_TEXT[currentLang];
  const labels = FRAME_LABELS[currentLang];
  const grid = document.getElementById('framesGrid');
  grid.innerHTML = '';
  grid.style.gridTemplateColumns = `repeat(${frames.length}, 1fr)`;

  frames.forEach((src, i) => {
    const item = document.createElement('div');
    item.className = 'frame-item';
    item.innerHTML = `
      <img src="${src}" alt="Frame ${i+1}">
      <div class="frame-label">${labels[i]}</div>
    `;
    grid.appendChild(item);
  });

  document.getElementById('framesLabel').textContent = t.framesLabel;
  document.getElementById('framesSection').classList.add('visible');
  document.getElementById('analyzeBtn').classList.add('visible');
}

// ─── ANALYSIS ─────────────────────────────────────────────────────────────────
async function runAnalysis() {
  const t = UI_TEXT[currentLang];
  document.getElementById('analyzeBtn').style.display = 'none';
  document.getElementById('resultCard').classList.remove('visible');
  document.getElementById('errorBox').classList.remove('visible');
  document.getElementById('newBtn').classList.remove('visible');

  const loadingState = document.getElementById('loadingState');
  loadingState.classList.add('visible');
  document.getElementById('loadingTitle').textContent = t.loadingTitle;
  document.getElementById('loadingSub').textContent = t.loadingSub;

  // Build loading steps UI
  const stepsEl = document.getElementById('loadingSteps');
  stepsEl.innerHTML = t.steps.map((s, i) =>
    `<div class="loading-step" id="step${i}"><div class="step-dot"></div><span>${s}</span></div>`
  ).join('');

  // Activate steps progressively
  activateStep(0);

  try {
    const labels = FRAME_LABELS[currentLang];

    // Deduplicate — if same image used for all frames, only send once
    const uniqueFrames = [...new Set(extractedFrames)].slice(0, 3);
    const frameBase64s = uniqueFrames.map(f => {
      const parts = f.split(',');
      return parts.length > 1 ? parts[1] : parts[0];
    });

    activateStep(1);

    const response = await fetch('/.netlify/functions/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        images: frameBase64s,
        frameLabels: labels.slice(0, frameBase64s.length),
        language: currentLang
      })
    });

    activateStep(2);

    let respData;
    try {
      respData = await response.json();
    } catch(e) {
      throw new Error('JSON parse fejl: ' + e.message);
    }

    if (!response.ok) {
      const errMsg = respData?.error?.message || respData?.error || 'Ukendt API fejl';
      throw new Error(`API ${response.status}: ${errMsg}`);
    }

    activateStep(3);

    const text = (respData.text || '').trim();

    if (!text) throw new Error('Tomt svar. Debug: ' + JSON.stringify(respData).substring(0, 200));

    setTimeout(() => {
      loadingState.classList.remove('visible');
      showResult(text);
    }, 600);

  } catch (err) {
    loadingState.classList.remove('visible');
    showError(err.message || 'Ukendt fejl');
    document.getElementById('analyzeBtn').style.display = 'flex';
  }
}

function activateStep(idx) {
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById(`step${i}`);
    if (!el) continue;
    el.classList.remove('active', 'done');
    if (i < idx) el.classList.add('done');
    else if (i === idx) el.classList.add('active');
  }
}

// ─── RESULT DISPLAY ───────────────────────────────────────────────────────────
function showResult(text) {
  const t = UI_TEXT[currentLang];
  document.getElementById('resultTitle').textContent = t.resultTitle;
  document.getElementById('resultSubtitle').textContent = t.resultSubtitle;

  const body = document.getElementById('resultBody');
  body.innerHTML = '';

  // Multiple possible key variants the AI might use
  const sections = [
    {
      keys: ['✓ STRENGTHS:', '✓ STYRKER:', '✓ 优点:', '**✓ STRENGTHS:**', '**✓ STYRKER:**'],
      label: t.labelStrengths, dotClass: 'green', labelClass: 'label-green', isQuote: false
    },
    {
      keys: ['→ FOCUS:', '→ FOKUS:', '→ 重点:', '**→ FOCUS:**', '**→ FOKUS:**'],
      label: t.labelFocus, dotClass: 'orange', labelClass: 'label-orange', isQuote: false
    },
    {
      keys: ['⬤ EXERCISE:', '⬤ ØVELSE:', '⬤ 练习:', '**⬤ EXERCISE:**', '**⬤ ØVELSE:**'],
      label: t.labelExercise, dotClass: 'blue', labelClass: 'label-blue', isQuote: false
    },
    {
      keys: ['↑ DEVELOPMENT CHAIN:', '↑ UDVIKLINGSKÆDE:', '↑ 发展链:', '**↑ DEVELOPMENT CHAIN:**', '**↑ UDVIKLINGSKÆDE:**'],
      label: t.labelChain, dotClass: 'frost', labelClass: 'label-blue', isQuote: false
    },
    {
      keys: ['💬 REMEMBER:', '💬 HUSK:', '💬 记住:', '**💬 REMEMBER:**', '**💬 HUSK:**'],
      label: t.labelQuote, dotClass: 'gold', labelClass: 'label-gold', isQuote: true
    },
  ];

  // Find which key variant exists in text
  function findKey(keys) {
    for (const k of keys) {
      const idx = text.indexOf(k);
      if (idx !== -1) return { key: k, idx };
    }
    return null;
  }

  const found = sections.map(s => {
    const match = findKey(s.keys);
    return match ? { ...s, matchKey: match.key, startIdx: match.idx } : null;
  }).filter(Boolean);

  found.sort((a, b) => a.startIdx - b.startIdx);

  found.forEach((section, i) => {
    const contentStart = section.startIdx + section.matchKey.length;
    const contentEnd = found[i + 1] ? found[i + 1].startIdx : text.length;
    const content = text.substring(contentStart, contentEnd).trim();
    if (!content) return;

    const div = document.createElement('div');
    div.className = 'result-section';

    if (section.isQuote) {
      div.innerHTML = `
        <div class="result-section-label ${section.labelClass}">
          <div class="label-dot ${section.dotClass}"></div>${section.label}
        </div>
        <div class="quote-box">${content}</div>
      `;
    } else {
      div.innerHTML = `
        <div class="result-section-label ${section.labelClass}">
          <div class="label-dot ${section.dotClass}"></div>${section.label}
        </div>
        <div class="result-text">${content}</div>
      `;
    }
    body.appendChild(div);
  });

  // Fallback — show full text if parsing found nothing
  if (body.children.length === 0) {
    body.innerHTML = `<div class="result-text">${text.replace(/\n/g, '<br>')}</div>`;
  }

  document.getElementById('resultCard').classList.add('visible');
  document.getElementById('newBtn').textContent = t.newBtn;
  document.getElementById('newBtn').classList.add('visible');
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = msg;
  el.classList.add('visible');
}

function resetApp() {
  extractedFrames = [];
  currentFile = null;
  document.getElementById('framesSection').classList.remove('visible');
  document.getElementById('analyzeBtn').classList.remove('visible');
  document.getElementById('analyzeBtn').style.display = '';
  document.getElementById('resultCard').classList.remove('visible');
  document.getElementById('newBtn').classList.remove('visible');
  document.getElementById('errorBox').classList.remove('visible');
  document.getElementById('loadingState').classList.remove('visible');
  document.getElementById('framesGrid').innerHTML = '';
  document.getElementById('fileInput').value = '';
}
</script>
